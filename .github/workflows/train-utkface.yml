name: Entrenar UTKFace (genero + edad)

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Epocas de cabeza (head-only)"
        required: false
        default: "10"
      batch_size:
        description: "Batch size"
        required: false
        default: "64"
      fine_tune_epochs:
        description: "Epocas de fine-tuning (0 = desactivado)"
        required: false
        default: "0"
  push:
    paths:
      - "training/.train-utkface-trigger"

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
      PYTHONUNBUFFERED: "1"
      EPOCHS: ${{ github.event.inputs.epochs || '10' }}
      BATCH_SIZE: ${{ github.event.inputs.batch_size || '64' }}
      FINE_TUNE_EPOCHS: ${{ github.event.inputs.fine_tune_epochs || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: training/requirements-train.txt

      - name: Instalar dependencias de entrenamiento
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            "tensorflow==2.15.1" \
            "tf2onnx==1.16.1" \
            "onnx==1.16.2" \
            "onnxruntime==1.18.1" \
            "opencv-python-headless>=4.9,<4.11" \
            "numpy>=1.26,<2" \
            "scikit-learn>=1.4,<1.6" \
            "matplotlib>=3.8,<4"

      - name: Self-test del parser UTKFace
        run: python training/train_utkface.py --self-test

      - name: Descargar y aplanar UTKFace
        run: |
          set -euo pipefail
          mkdir -p training/data/utkface_raw training/data/utkface
          curl -fL --retry 3 --retry-delay 5 \
            -o training/data/utk_faces_images.zip \
            "https://huggingface.co/datasets/nlphuji/utk_faces/resolve/main/utk_faces_images.zip"
          unzip -q training/data/utk_faces_images.zip -d training/data/utkface_raw
          find training/data/utkface_raw -type f \
            -not -path '*/__MACOSX/*' -not -name '._*' \
            \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) \
            -exec cp -t training/data/utkface {} +
          count=$(find training/data/utkface -type f | wc -l)
          echo "Imagenes UTKFace: ${count}"
          test "${count}" -ge 20000

      - name: Entrenar y exportar ONNX NCHW
        run: |
          set -euo pipefail
          python training/train_utkface.py \
            --dataset-dir training/data/utkface \
            --epochs "${EPOCHS}" \
            --fine-tune-epochs "${FINE_TUNE_EPOCHS}" \
            --batch-size "${BATCH_SIZE}" \
            --learning-rate 0.0003 \
            --patience 3 \
            --no-validate \
            --output-dir training/output

      - name: Validar ONNX con OpenCV DNN
        run: |
          set -euo pipefail
          python - <<'PY'
          import cv2
          import numpy as np
          from pathlib import Path

          path = Path("training/output/utkface_mobilenetv2.onnx")
          assert path.exists(), path
          net = cv2.dnn.readNetFromONNX(str(path))
          image = np.zeros((224, 224, 3), dtype=np.uint8)
          blob = cv2.dnn.blobFromImage(
              image, 1.0 / 127.5, (224, 224), (127.5, 127.5, 127.5),
              swapRB=True, crop=False,
          )
          assert blob.shape == (1, 3, 224, 224), blob.shape
          net.setInput(blob)
          names = net.getUnconnectedOutLayersNames()
          outputs = net.forward(names)
          print("OpenCV DNN OK; salidas:")
          shapes = []
          for name, output in zip(names, outputs):
              print(f"  {name}: {output.shape}")
              shapes.append(output.shape[-1])
          assert 1 in shapes, shapes
          assert 8 in shapes, shapes
          PY

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: utkface-onnx
          path: |
            training/output/utkface_mobilenetv2.onnx
            training/output/evaluation.json
            training/output/training_history.json
            training/output/confusion_matrix.png
            training/output/training_history.png
          if-no-files-found: error
          retention-days: 30
